<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vlokje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Gluten:wght@700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: ein Bildschirm, Polaroid-Startseite, danach Vollbild-Canvas mit schwebenden Chips */
:root{
  --bg:#c9d4f1; --ink:#24305a; --paper:#fffaf2; --ball:#3d7bff; --blush:#f0718a; --soft:#e9eefb;
  --display:'Gluten','Comic Sans MS',cursive;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Segoe Print',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);cursor:var(--paw,auto);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:inherit}
button:focus-visible{outline:3px solid var(--ball);outline-offset:3px}

#game{position:fixed;inset:0;display:block;touch-action:none}

/* Start */
#start{position:fixed;inset:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--bg);background-image:var(--pawbg,none);background-size:150px 150px}
.card{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px;text-align:center;margin:auto}
.polaroid{margin:0;background:var(--paper);padding:12px 12px 48px;border-radius:3px;width:min(250px,58vw,36vh);position:relative;
  box-shadow:0 2px 0 rgba(36,48,90,.08),0 18px 36px rgba(36,48,90,.22);transform:rotate(-3deg);animation:sway 6s ease-in-out infinite}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:2px;pointer-events:none}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:8px;font-family:var(--hand);font-size:27px;line-height:1}
.tape{position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(61,123,255,.35);transform:rotate(4deg)}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-1deg) translateY(-4px)}}
h1{font-family:var(--display);font-weight:700;font-size:clamp(54px,13vw,86px);line-height:.85;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.sub{margin:0;font-size:17px;font-weight:700;opacity:.75}
.btns{display:flex;flex-direction:column;gap:10px;width:min(300px,100%);margin-top:4px}
.btn{border:0;border-radius:999px;padding:15px 22px;font-weight:800;font-size:18px;background:var(--ink);color:var(--paper);
  box-shadow:0 4px 0 rgba(20,26,50,.25);transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(20,26,50,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(20,26,50,.25)}
.btn.ball{background:var(--ball);color:#fff}
.stats{margin:0;font-size:14px;font-weight:700;opacity:.65;font-variant-numeric:tabular-nums;min-height:1.2em}
.link{border:0;background:none;font-weight:800;font-size:15px;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
#hud>*{pointer-events:auto}
.mid{justify-self:center;display:flex;min-width:0}
.chip{border:0;border-radius:999px;padding:9px 14px;background:rgba(255,250,242,.92);color:var(--ink);font-weight:800;font-size:14px;
  box-shadow:0 3px 10px rgba(36,48,90,.15);white-space:nowrap}
button.chip:hover{background:var(--paper)}
.meter{display:flex;align-items:center;gap:8px}
.meter .hrt{color:var(--blush);font-size:16px;line-height:1}
.bar{display:block;width:clamp(70px,22vw,160px);height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
#loveFill{display:block;height:100%;width:50%;border-radius:99px;background:linear-gradient(90deg,#f7a6b6,var(--blush));transition:width .3s}
#fStats{font-variant-numeric:tabular-nums}

.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.bottom>*{pointer-events:auto}
.tools{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,250,242,.94);box-shadow:0 3px 12px rgba(36,48,90,.18)}
.tool{border:0;background:transparent;border-radius:999px;padding:10px 18px;font-weight:800;font-size:15px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.swap{background:var(--ball);color:#fff;padding:12px 16px;font-size:15px}
button.chip.swap:hover{background:#2f6ef5}
.hint{margin:0;max-width:min(92vw,520px);text-align:center;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;
  background:rgba(36,48,90,.72);color:var(--paper);pointer-events:none!important}

#toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(26px,6vw,40px);
  color:var(--paper);text-shadow:0 3px 0 rgba(36,48,90,.55),0 6px 18px rgba(36,48,90,.35);pointer-events:none;opacity:0;white-space:nowrap;text-align:center}
#toast.show{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

#note{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(36,48,90,.45);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;animation:fade .4s ease}
.letter{background:var(--paper);width:min(420px,100%);border-radius:6px;padding:28px 26px 24px;box-shadow:0 20px 50px rgba(20,26,50,.35);transform:rotate(1deg);
  display:flex;flex-direction:column;gap:12px;max-height:100%;overflow-y:auto}
.letter p{margin:0;font-family:var(--hand);font-size:25px;line-height:1.25;white-space:pre-line}
.letter .from{text-align:right}
.letter .btn{align-self:center;margin-top:8px;font-size:16px;padding:12px 20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.polaroid{animation:none}#toast.show{animation-duration:2.6s}}
</style>

</head>

$('#mTreat').addEventListener('click', () => setMode('treat'));
$('#getUp').addEventListener('click', () => { const d = yard.d; if (d.st === 'lie' || d.st === 'toBedCmd') { d.st = 'idle'; d.timer = 1.2; yard.lastAct = T(); yard.hop(10); yard.say('wuff!', 1); sfx.wuff(); } showUp(false); });
$('#mute').addEventListener('click', () => { store.muted = !store.muted; save(); setMuteLabel(); });
$('#openNote').addEventListener('click', openNote);
$('#noteClose').addEventListener('click', closeNote);
$('#note').addEventListener('click', e => { if (e.target.id === 'note') closeNote(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#note').hidden) closeNote(); else if (scene) go('start'); } });

cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {} if (scene && $('#note').hidden) scene.down(e.clientX, e.clientY); });
cv.addEventListener('pointermove', e => { if (scene) scene.move(e.clientX, e.clientY); });
cv.addEventListener('pointerup', e => { if (scene) scene.up(e.clientX, e.clientY, e.pointerType); });
cv.addEventListener('pointercancel', e => { if (scene) { if (scene === fetchS) fetchS.drag = null; else yard.ptr.t = -10; } });
cv.addEventListener('pointerleave', e => { if (scene === yard && e.pointerType === 'mouse') yard.ptr.t = -10; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000)); last = t;
  if (scene) { scene.update(dt); scene.draw(); }
  requestAnimationFrame(loop);
}
setMuteLabel(); startStats(); resize(); requestAnimationFrame(loop);
window.__vlokje = { yard, fetchS, go, store, bufs };
})();
</script>

</body>
